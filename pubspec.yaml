name: drishtibution
description: Accessible resource directory for people who are blind or visually impaired.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.7
  cloud_functions: ^5.5.0
  dio: ^5.7.0
  flutter_dotenv: ^6.0.0
  flutter_sound: ^9.18.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/command_lexicon.json
